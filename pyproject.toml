[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbot"
version = "0.1.0"
description = "轻量级量化交易机器人: 策略、回测、风控、参数优化、模拟盘与实盘"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
live = ["ccxt>=4.0"]
stocks = ["yfinance>=0.2"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
quantbot = "quantbot.cli:main"

[tool.setuptools]
packages = ["quantbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
