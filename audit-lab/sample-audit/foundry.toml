[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# 固定编译器版本，并离线使用（二进制已预置到 ~/.svm/0.8.26，
# 因为代理禁止访问 binaries.soliditylang.org 自动下载）
solc_version = "0.8.26"
offline = true

optimizer = true
optimizer_runs = 200

# 测试相关
[fuzz]
runs = 256

[invariant]
runs = 256
depth = 128

# 参考: https://book.getfoundry.sh/reference/config/
